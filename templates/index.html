<!DOCTYPE html>
<html>
<head>
    <title>AI network Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<h1>AI Network Assistant</h1>
<p>Describe your network porblem below.</p>
<form method="POST">
<textarea name="problem" rows="6" cols="50"></textarea>
<br>
<button type="submit">Analyze Problem</button>
</form>
{% if problem %}
<h2>Your Problem</h2>
<p>{{ problem }}</p>
{% endif %}
{% if answer %}
<h2>AI Analysis</h2>
<pre>{{ answer }}</pre>
{% endif %}
</body>
</html>
